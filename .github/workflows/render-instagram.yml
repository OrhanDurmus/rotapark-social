name: Render Instagram JPEG
on:
  push:
    paths:
      - 'social/*.svg'
      - '.github/workflows/render-instagram.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install renderer
        run: python -m pip install cairosvg pillow
      - name: Render JPEG from SVG
        run: |
          python - <<'PY'
          import glob, io, os
          import cairosvg
          from PIL import Image
          for path in glob.glob("social/*.svg"):
              png = cairosvg.svg2png(url=path, output_width=1080, output_height=1350)
              img = Image.open(io.BytesIO(png)).convert("RGB")
              output = os.path.splitext(path)[0] + ".jpg"
              img.save(output, "JPEG", quality=91, optimize=True)
              print(output, os.path.getsize(output))
          PY
      - name: Commit generated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social/*.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Render Instagram JPEG assets"
            git push
          fi
